<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#2D7D32" stroke="#1B5E20" stroke-width="2"/>

  <!-- Farm barn -->
  <rect x="16" y="35" width="32" height="18" fill="#8D6E63"/>
  <polygon points="16,35 32,22 48,35" fill="#D32F2F"/>

  <!-- Barn door -->
  <rect x="28" y="42" width="8" height="11" fill="#5D4037"/>

  <!-- Pig silhouette -->
  <circle cx="32" cy="40" r="6" fill="#F8BBD9"/>
  <circle cx="30" cy="38" r="0.8" fill="#000"/>
  <circle cx="34" cy="38" r="0.8" fill="#000"/>
  <ellipse cx="32" cy="42" rx="2.5" ry="1.5" fill="#E91E63"/>
  <circle cx="31" cy="42" r="0.3" fill="#000"/>
  <circle cx="33" cy="42" r="0.3" fill="#000"/>

  <!-- Small ears -->
  <ellipse cx="28" cy="35" rx="1.5" ry="2" fill="#E91E63" transform="rotate(-20 28 35)"/>
  <ellipse cx="36" cy="35" rx="1.5" ry="2" fill="#E91E63" transform="rotate(20 36 35)"/>

  <!-- Letter C for Chipper -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff" font-weight="bold">C</text>
</svg>
