<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Farm background -->
  <rect width="64" height="64" fill="#4CAF50" rx="8"/>
  
  <!-- Barn/Farm building -->
  <rect x="8" y="35" width="48" height="20" fill="#8B4513"/>
  <polygon points="8,35 32,20 56,35" fill="#DC143C"/>
  
  <!-- Pig silhouette -->
  <circle cx="32" cy="42" r="8" fill="#FFB6C1"/>
  <circle cx="29" cy="40" r="1" fill="#000"/>
  <circle cx="35" cy="40" r="1" fill="#000"/>
  <ellipse cx="32" cy="44" rx="3" ry="2" fill="#FF69B4"/>
  <circle cx="31" cy="44" r="0.5" fill="#000"/>
  <circle cx="33" cy="44" r="0.5" fill="#000"/>
  
  <!-- Farm text -->
  <text x="32" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#fff" font-weight="bold">FARM</text>
