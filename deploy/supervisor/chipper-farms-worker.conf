; Supervisor configuration for Chipper Farms queue workers (CF-P1-022).
;
; The audit found no worker supervision of any kind. Without it, `queue:work`
; runs until something kills it and then simply stops — no restart, no alert.
; Because the finance outbox drains through a scheduled job rather than the
; queue, a dead worker does not stop finance postings outright, which is worse:
; failures are quiet and only noticed when someone asks why a notification never
; arrived.
;
; INSTALLATION
;   sudo cp deploy/supervisor/*.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Adjust the paths and `user` to match the deployment before use.

[program:chipper-farms-worker]
process_name=%(program_name)s_%(process_num)02d

; --max-time=3600 recycles each worker hourly. Long-lived PHP processes
;   accumulate memory and, more importantly, hold a stale copy of the code:
;   without recycling a worker keeps running the PREVIOUS release after a deploy
;   until something restarts it.
; --max-jobs=1000 is a second ceiling for the same reason.
; --tries=3 with --backoff gives transient failures (a lock wait, a brief
;   database blip) a chance before the job is moved to failed_jobs.
; --timeout=90 MUST stay below the connection's retry_after (DB_QUEUE_RETRY_AFTER,
;   default 90) or the queue will hand the same job to a second worker while the
;   first is still running it — duplicate execution presenting as a mystery.
command=php /var/www/chipper-farms/artisan queue:work
    --queue=high,default,low
    --sleep=3
    --tries=3
    --backoff=10,30,60
    --max-time=3600
    --max-jobs=1000
    --timeout=90

directory=/var/www/chipper-farms
autostart=true
autorestart=true

; Do NOT set startretries too low. A worker that fails on boot because the
; database is briefly unavailable during a deploy should keep trying.
startretries=10
startsecs=5

; SIGTERM lets queue:work finish the job in hand before exiting. Killing a worker
; mid-job is how half-applied work happens.
stopwaitsecs=120
stopsignal=TERM
killasgroup=true

user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/chipper-farms/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
